<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>PMSV Hygiene Rating Audit</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#f4f8f6}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="audit" title="FSSAI Hygiene Rating Audit"></iframe><script>
const allowed=new Set(['hygiene-rating.html','hygiene-rating-sweet-shop.html','hygiene-rating-meat.html']);
const p=new URLSearchParams(location.search),src=p.get('src'),draft=p.get('draft');
if(!allowed.has(src)){location.replace('hygiene-rating-new.html')}else{
 const f=document.getElementById('audit');
 const inner=new URLSearchParams();
 if(draft)inner.set('draft',draft);
 inner.set('ui',Date.now());
 f.src=src+'?'+inner.toString();
 f.onload=()=>{
   const d=f.contentDocument;if(!d)return;
   ['pmsvCommonVisualUiLoader','pmsvHygieneUiLoader'].forEach(id=>d.getElementById(id)?.remove());
   const visual=d.createElement('script');visual.id='pmsvCommonVisualUiLoader';visual.src='audit-ui.js?v=8';
   visual.onload=()=>{const h=d.createElement('script');h.id='pmsvHygieneUiLoader';h.src='hygiene-checklist-ui.js?v=8';d.body.appendChild(h)};
   d.body.appendChild(visual);
 }
}
</script></body></html>
