<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hygiene Rating Report | PMSV</title><style>body{font-family:system-ui,Arial;background:#f4f8f6;color:#17231f;margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}.head{background:#0b6b53;color:#fff;padding:22px;border-radius:16px}.head a{color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.box,.card{background:#fff;border:1px solid #dce8e3;border-radius:14px;padding:14px}.box b{display:block;font-size:22px;color:#0b6b53}.card{margin:12px 0}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:9px;border-bottom:1px solid #dce8e3;text-align:left;vertical-align:top}th{background:#eaf4f0}.nc{background:#fde5e3}.crit{color:#b42318}.btn{padding:10px 13px;background:#0b6b53;color:#fff;border:0;border-radius:9px;font-weight:700}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media print{.btn,.back{display:none}body{background:#fff}}</style></head><body><div class="wrap"><div class="head"><a class="back" href="hygiene-rating-home.html">← Hygiene Rating</a><h1>FSSAI Hygiene Rating Audit Report</h1><div id="meta"></div></div><div class="grid" id="summary"></div><div class="card"><button class="btn" onclick="window.print()">Download / Print PDF</button></div><div class="card table"><table><thead><tr><th>No.</th><th>Requirement</th><th>Status</th><th>Score</th><th>Comments / Evidence</th></tr></thead><tbody id="rows"></tbody></table></div><div class="card" id="ncFollow"><h2>NC Follow-up</h2><div id="ncs"></div></div></div><script>const KEY='pmsvHygieneRatingAudits',id=new URLSearchParams(location.search).get('audit');let all=[];try{all=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}let a=all.find(x=>x.id===id);if(!a){document.body.innerHTML='<p style="padding:30px">Audit not found.</p>';throw new Error('Audit not found')}const e=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));meta.innerHTML='<b>'+e(a.fbo||'Unnamed FBO')+'</b> · '+e(a.outlet||'')+'<br>'+e(a.address||'')+' · '+e(a.date||'')+' · Licence: '+e(a.license||'—');let nc=(a.items||[]).filter(x=>x.status==='NC'),crit=nc.filter(x=>x.critical);summary.innerHTML='<div class="box"><b>'+e(a.percentage)+'%</b>Score</div><div class="box"><b>'+e(a.rating)+'</b>Hygiene Rating</div><div class="box"><b>'+nc.length+'</b>NC</div><div class="box"><b>'+crit.length+'</b>Critical NC</div>';rows.innerHTML=(a.items||[]).map(x=>'<tr class="'+(x.status==='NC'?'nc':'')+'"><td>'+x.no+(x.critical?'*':'')+'</td><td>'+e(x.question)+'</td><td>'+e(x.status||'—')+'</td><td>'+e(x.score)+'/'+e(x.max)+'</td><td>'+e(x.comment||'')+'</td></tr>').join('');ncs.innerHTML=nc.length?nc.map(x=>'<div class="card"><b class="'+(x.critical?'crit':'')+'">'+(x.critical?'Critical NC':'NC')+' — '+e(x.question)+'</b><p>'+e(x.comment||'No audit comment entered.')+'</p><label>Status <select data-n="'+x.no+'"><option>Open</option><option>In Progress</option><option>Closed</option></select></label><br><textarea data-c="'+x.no+'" style="width:100%;min-height:70px;margin-top:8px" placeholder="Corrective action / closure evidence"></textarea></div>').join(''):'<p>No NC findings.</p>';function save(){a.ncClosure=nc.map(x=>({no:x.no,status:document.querySelector('[data-n="'+x.no+'"]')?.value||'Open',comment:document.querySelector('[data-c="'+x.no+'"]')?.value||''}));a.savedAt=new Date().toISOString();let i=all.findIndex(x=>x.id===a.id);if(i>=0)all[i]=a;localStorage.setItem(KEY,JSON.stringify(all))}(a.ncClosure||[]).forEach(c=>{let s=document.querySelector('[data-n="'+c.no+'"]'),t=document.querySelector('[data-c="'+c.no+'"]');if(s)s.value=c.status||'Open';if(t)t.value=c.comment||''});document.querySelectorAll('[data-n],[data-c]').forEach(x=>x.onchange=save)</script></body></html>
