<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>PMSV NC Management</title><style>:root{--g:#0b6b53;--g2:#0f8a68;--ink:#15231f;--muted:#63736d;--bg:#f4f8f6;--line:#dce8e3;--red:#b42318;--amber:#8a6500}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:20px 16px}.wrap{max-width:1150px;margin:auto}.back{color:#fff;text-decoration:none;font-weight:750}.head h1{margin:16px 0 4px}.head p{margin:0;color:#e5f5ef}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.metric,.card{background:#fff;border:1px solid var(--line);border-radius:16px}.metric{padding:13px}.metric b{display:block;font-size:23px;margin-top:3px}.card{padding:17px;margin:13px 0}.auditmeta{line-height:1.6}.tag{display:inline-block;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:850}.tag.pc{background:#fff4cf;color:var(--amber)}.tag.nc{background:#fde5e3;color:var(--red)}.tag.critical{background:#b42318;color:#fff}.finding-link{text-decoration:none}.finding-link .tag{text-decoration:underline;text-underline-offset:2px;cursor:pointer}.finding-link:hover .tag{filter:brightness(.94)}.question{font-weight:750;line-height:1.45;margin-top:7px}.original{margin-top:8px;padding:10px 12px;background:#f7faf8;border-radius:10px;color:#45534e;white-space:pre-wrap}.status{font-size:12px;font-weight:850;border-radius:999px;padding:5px 9px;display:inline-block}.status.open{background:#fff0ee;color:var(--red)}.status.closed{background:#e8f6ef;color:var(--g)}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:var(--g);color:#fff;white-space:nowrap}.btn.secondary{background:#344a43}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}label{font-size:12px;font-weight:800;color:#45534e}input,textarea,select{width:100%;border:1px solid #cbdad4;border-radius:10px;padding:10px;font:inherit;background:#fff}textarea{min-height:86px;resize:vertical}.actions{position:sticky;bottom:0;background:rgba(244,248,246,.96);padding:12px 0;display:flex;gap:10px;justify-content:flex-end}.saved{font-size:13px;font-weight:750;color:var(--g);align-self:center}.empty{text-align:center;padding:40px 15px}.note{font-size:12px;color:var(--muted);line-height:1.5;margin:18px 0}@media(max-width:700px){.summary{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.actions{justify-content:stretch}.actions .btn{flex:1}}</style></head><body><header><div class="wrap head"><a class="back" id="topBack" href="index.html?view=nc">← NC Management</a><h1 id="pageTitle">NC Management</h1><p id="pageSub">Audit findings and closure status.</p></div></header><main class="wrap" id="main"></main><script>const AUDIT_KEY='pmsvFssaiAudits',NC_KEY='pmsvFssaiNcManagement',params=new URLSearchParams(location.search),id=params.get('audit'),findingParam=params.get('finding');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let audits=[];try{audits=JSON.parse(localStorage.getItem(AUDIT_KEY)||'[]')}catch(e){}const audit=audits.find(x=>x.id===id);if(!audit){main.innerHTML='<section class="card empty"><h2>Audit not found</h2><p>Return to NC Management and select a completed audit.</p><a href="index.html?view=nc">Back</a></section>';throw new Error('Audit not found')}const findings=(audit.items||[]).filter(x=>x.status==='PC'||x.status==='NC');let allNc={};try{allNc=JSON.parse(localStorage.getItem(NC_KEY)||'{}')}catch(e){}let record=allNc[id]||{auditId:id,updatedAt:null,items:{}};function key(x,i){return String(x.no||i)}function current(x,i){return record.items[key(x,i)]||{rootCause:'',correction:'',correctionTarget:'',correctiveAction:'',correctiveTarget:'',responsibility:'',correctionReview:'',correctiveReview:'',reviewDate:'',actualCompletion:'',status:'Open'}}function fmt(v){if(!v)return '—';const d=new Date(v);return isNaN(d)?v:d.toLocaleString()}function tag(x){return x.status==='PC'?'<span class="tag pc">PC</span>':x.critical?'<span class="tag critical">CRITICAL NC</span>':'<span class="tag nc">NC</span>'}function auditHeader(){return `<section class="card auditmeta"><b>${esc(audit.fboName||audit.fbo||'Unnamed FBO')}</b><div>${esc(audit.businessType||audit.type||'FSSAI Audit')}</div><div><b>Audit date:</b> ${esc(audit.date||'—')} &nbsp; <b>Auditor:</b> ${esc(audit.auditor||'—')}</div><div><b>FBO representative:</b> ${esc(audit.representative||'—')} &nbsp; <b>License:</b> ${esc(audit.license||'—')}</div></section>`}function renderList(){pageTitle.textContent='NC Management';pageSub.textContent='Findings and closure status for this completed audit.';topBack.href='index.html?view=nc';topBack.textContent='← NC Management';const pc=findings.filter(x=>x.status==='PC').length,nc=findings.filter(x=>x.status==='NC').length,crit=findings.filter(x=>x.status==='NC'&&x.critical).length,closed=findings.filter((x,i)=>current(x,i).status==='Closed').length;main.innerHTML=auditHeader()+`<div class="summary"><div class="metric">Findings<b>${findings.length}</b></div><div class="metric">PC<b>${pc}</b></div><div class="metric">NC / Critical<b>${nc} / ${crit}</b></div><div class="metric">Closed<b>${closed}/${findings.length}</b></div></div>${findings.length?findings.map((x,i)=>{const c=current(x,i),k=key(x,i),href='nc-management.html?audit='+encodeURIComponent(id)+'&finding='+encodeURIComponent(k);return `<section class="card"><div><a class="finding-link" href="${href}">${tag(x)}</a> &nbsp; <b>Checklist ${esc(x.no||'')}</b> &nbsp; <span class="status ${c.status==='Closed'?'closed':'open'}">${esc(c.status)}</span></div><div class="question">${esc(x.question||'')}</div>${x.comment?`<div class="original"><b>Audit observation / evidence:</b><br>${esc(x.comment)}</div>`:''}${c.actualCompletion?`<div class="note"><b>Actual completion:</b> ${esc(c.actualCompletion)}</div>`:''}</section>`}).join(''):'<section class="card empty">No PC or NC findings in this audit.</section>'}<p class="note">Tap the PC, NC or Critical NC label to open that finding's closure sheet.</p>`}function renderForm(idx){const x=findings[idx],c=current(x,idx),k=key(x,idx);pageTitle.textContent='NC Closure Sheet';pageSub.textContent='Correction and corrective-action follow-up for one audit finding.';topBack.href='nc-management.html?audit='+encodeURIComponent(id);topBack.textContent='← Findings List';main.innerHTML=auditHeader()+`<section class="card"><div>${tag(x)} &nbsp; <b>Checklist ${esc(x.no||'')}</b> &nbsp; <span class="status ${c.status==='Closed'?'closed':'open'}">${esc(c.status)}</span></div><div class="question">${esc(x.question||'')}</div>${x.comment?`<div class="original"><b>Audit observation / evidence:</b><br>${esc(x.comment)}</div>`:''}</section><section class="card finding" data-k="${esc(k)}"><div class="formgrid"><div class="field full"><label>Root Cause Analysis</label><textarea data-f="rootCause">${esc(c.rootCause)}</textarea></div><div class="field full"><label>Correction Proposed</label><textarea data-f="correction">${esc(c.correction)}</textarea></div><div class="field"><label>Target Date for Correction</label><input type="date" data-f="correctionTarget" value="${esc(c.correctionTarget)}"></div><div class="field"><label>Responsibility / Department In-charge</label><input data-f="responsibility" value="${esc(c.responsibility)}"></div><div class="field full"><label>Corrective Action Proposed</label><textarea data-f="correctiveAction">${esc(c.correctiveAction)}</textarea></div><div class="field"><label>Target Date for Corrective Action</label><input type="date" data-f="correctiveTarget" value="${esc(c.correctiveTarget)}"></div><div class="field"><label>Actual Completion Date</label><input type="date" data-f="actualCompletion" value="${esc(c.actualCompletion)}"></div><div class="field full"><label>Correction Review</label><textarea data-f="correctionReview">${esc(c.correctionReview)}</textarea></div><div class="field full"><label>Corrective Action Review</label><textarea data-f="correctiveReview">${esc(c.correctiveReview)}</textarea></div><div class="field"><label>Review Date</label><input type="date" data-f="reviewDate" value="${esc(c.reviewDate)}"></div><div class="field"><label>Closure Status</label><select data-f="status"><option${c.status==='Open'?' selected':''}>Open</option><option${c.status==='Closed'?' selected':''}>Closed</option></select></div></div></section><div class="actions"><span class="saved" id="savedMsg">${record.updatedAt?'Last saved: '+esc(fmt(record.updatedAt)):''}</span><button class="btn secondary" onclick="location.href='nc-management.html?audit=${encodeURIComponent(id)}'">Back to Findings</button><button class="btn" onclick="saveOne(${idx})">Save Closure</button></div><p class="note">Structure follows FSSAI correction/corrective-action terminology. PMSV is an independent compliance tool and is not affiliated with FSSAI.</p>`}function saveOne(idx){const sec=document.querySelector('.finding'),o={};sec.querySelectorAll('[data-f]').forEach(e=>o[e.dataset.f]=e.value);record.items[key(findings[idx],idx)]=o;record.updatedAt=new Date().toISOString();allNc[id]=record;localStorage.setItem(NC_KEY,JSON.stringify(allNc));savedMsg.textContent='Saved ✓ '+fmt(record.updatedAt);setTimeout(()=>renderForm(idx),400)}function route(){if(findingParam!=null){const decoded=decodeURIComponent(findingParam);const idx=findings.findIndex((x,i)=>key(x,i)===decoded);if(idx>=0){renderForm(idx);return}}renderList()}route();</script></body></html>
