<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FSSAI Hygiene Rating | PMSV Audits</title><style>:root{--g:#0b6b53;--g2:#0f8a68;--ink:#15231f;--muted:#63736d;--bg:#f4f8f6;--line:#dce8e3}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:28px 18px 38px}.wrap{max-width:960px;margin:auto}.back{color:#fff;font-weight:750}h1{font-size:clamp(28px,5vw,44px);margin:24px 0 8px}header p{color:#e5f5ef}main{padding:24px 16px}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:-32px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.action{border:1px solid var(--line);border-radius:18px;background:#fff;padding:22px 18px;text-align:left;cursor:pointer;min-height:150px}.action:first-child{background:#effaf6}.action:last-child{background:#fff8ed}.ico{font-size:30px;display:block}.title{font-size:18px;font-weight:800}.desc{display:block;color:var(--muted);font-size:13px;margin-top:6px}.list{display:grid;gap:12px}.card{border:1px solid var(--line);border-radius:15px;padding:15px;background:#fff;display:flex;justify-content:space-between;gap:14px}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:750;background:var(--g);color:#fff}.time{color:var(--g);font-size:13px;font-weight:750}.hidden{display:none}.empty{text-align:center;color:var(--muted);padding:28px}@media(max-width:700px){.actions{grid-template-columns:1fr}.card{flex-direction:column}}</style></head><body><header><div class="wrap"><a class="back" href="index.html">← Audits</a><h1>FSSAI Hygiene Rating</h1><p>New audit, saved audits and NC follow-up.</p></div></header><main><div class="wrap"><section class="panel" id="landing"><div class="actions"><button class="action" onclick="location.href='hygiene-rating.html'"><span class="ico">＋</span><span class="title">New Audit</span><span class="desc">Start the Hygiene Rating checklist.</span></button><button class="action" id="savedBtn"><span class="ico">📋</span><span class="title">Saved Audits</span><span class="desc">Resume drafts or review completed audits.</span></button><button class="action" id="ncBtn"><span class="ico">✓</span><span class="title">NC Follow-up</span><span class="desc">Follow up NC and Critical NC findings.</span></button></div></section><section class="panel hidden" id="panel"><button class="btn" id="back">← Back</button><h2 id="heading"></h2><div class="list" id="list"></div></section></div></main><script>const KEY='pmsvHygieneRatingAudits';function get(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function show(mode){landing.classList.add('hidden');panel.classList.remove('hidden');heading.textContent=mode==='nc'?'NC Follow-up':'Saved Audits';let a=get().sort((x,y)=>new Date(y.savedAt||0)-new Date(x.savedAt||0));if(mode==='nc')a=a.filter(x=>x.status==='Completed'&&(x.items||[]).some(i=>i.status==='NC'));list.innerHTML=a.length?a.map(x=>{let n=(x.items||[]).filter(i=>i.status==='NC').length,c=(x.items||[]).filter(i=>i.status==='NC'&&i.critical).length;return `<div class="card"><div><b>${esc(x.fbo||'Unnamed FBO')}</b><div>${esc(x.outlet||'')} · ${esc(x.date||'')}</div><div>${esc(x.percentage)}% · ${esc(x.rating||'')}</div>${mode==='nc'?`<div>NC: ${n} · Critical NC: ${c}</div>`:''}<div class="time">Last saved: ${new Date(x.savedAt).toLocaleString()}</div></div><button class="btn" onclick="openA('${esc(x.id)}','${esc(x.status)}','${mode}')">${mode==='nc'?'Open NC Follow-up':x.status==='Draft'?'Resume':'View'}</button></div>`}).join(''):'<div class="empty">No matching audits yet.</div>'}function openA(id,status,mode){location.href=mode==='nc'?'hygiene-rating-report.html?audit='+encodeURIComponent(id)+'#nc':status==='Draft'?'hygiene-rating.html?draft='+encodeURIComponent(id):'hygiene-rating-report.html?audit='+encodeURIComponent(id)}savedBtn.onclick=()=>show('saved');ncBtn.onclick=()=>show('nc');back.onclick=()=>{panel.classList.add('hidden');landing.classList.remove('hidden')}</script></body></html>
